name: recipe_app
description: A cloud-synced Flutter recipe discovery app powered by Firebase.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.2
  cloud_firestore: ^5.6.12
  firebase_auth: ^5.4.11
  google_sign_in: ^6.2.1
  firebase_messaging: ^15.2.10

  # State management
  provider: ^6.1.5+1
  shared_preferences: ^2.3.2

  # UI / Icons
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/placeholder_food.png
